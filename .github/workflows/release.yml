# Pushing a version tag (e.g. v1.1.0) builds the installer and attaches it to a GitHub Release.
# The app checks Releases/latest and offers the update in its status bar.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Version from tag
        shell: pwsh
        run: '"NOTLAR_VERSION=$($env:GITHUB_REF_NAME.TrimStart(''v''))" | Out-File -Append $env:GITHUB_ENV'
      - name: Build and package
        shell: cmd
        run: build-setup.cmd
      - name: SHA-256
        shell: pwsh
        run: Get-ChildItem dist\*.exe | ForEach-Object { (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower() | Out-File -NoNewline -Encoding ascii "$($_.FullName).sha256" }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = Get-ChildItem dist\* | ForEach-Object { $_.FullName }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "NoteBook $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber @files
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false
