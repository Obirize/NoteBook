ShortDescription: Apple Notes–style encrypted notebook for Windows. Local, dark, no account.
Description: |-
  NoteBook is a local, dark-themed notebook for Windows in the spirit of Apple Notes.
  Every note is encrypted at rest with AES-256-GCM; the key is protected by Windows for the current user, so there is no password to remember and no account.
  Search, pin, multi-select, a 30-day Recently deleted folder, TXT import/export, 13 interface languages and automatic updates.
